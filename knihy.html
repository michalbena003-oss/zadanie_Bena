<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kniznica</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="knihy.js" defer></script>
</head>
<body>
    <main>
        <section>
            <h1>Moja kniznica</h1>
            <p id="prihlasenyInfo"></p>
            <form id="formular">
                <input id="nazov" placeholder="Nazov knihy" required>
                <input id="autor" placeholder="autor" required>
                <input id="rok" type="number" placeholder="Rok" required>
                <input id="cena" type="number" step="0.01" min="0" placeholder="Cena (€)" required>
                <button>Pridat knihu</button>
            </form>
            <div id="filterPanel" style="margin: 15px 0;">
                <input id="hladatInput" type="text" placeholder="Hladat nazov alebo autora...">

                <select id="zoraditSelect">
                    <option value="id">Zoradit podla: ID</option>
                    <option value="nazov">Nazov</option>
                    <option value="autor">Autor</option>
                    <option value="rok">Rok vydania</option>
                    <option value="cena">Cena</option>
                </select>

                <select id="smerSelect">
                    <option value="ASC">Vzostupne (ASC)</option>
                    <option value="DESC">Zostupne (DESC)</option>
                </select>

                <button id="resetFilterBtn" type="button">Zrusit filter</button>
            </div>
            <table border="1" cellpadding="8">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nazov</th>
                        <th>Autor</th>
                        <th>Rok</th>
                        <th>Cena (€)</th>
                        <th>Akcia</th>
                    </tr>
                </thead>
                <tbody id="zoznam"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
